<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding P&N</title>
<style>
    /* --- สไตล์เริ่มต้น (สำหรับ Desktop) --- */
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column; /* จัดเรียงแนวตั้ง */
        background-color: #f0f0f0;
        font-family: sans-serif;
    }

    h2 {
        color: #333;
    }

    /* คอนเทนเนอร์ของการ์ด (ขนาดเท่ามือถือ) */
    .flip-card {
        background-color: transparent;
        width: 360px; /* ขนาดกว้างเหมือนมือถือ */
        height: 510px;  /*ขนาดสูงเหมือนมือถือ */
        perspective: 1000px;
        cursor: pointer;
        /*border-radius: 15px;  เพิ่มขอบมนสำหรับมุมมอง desktop */
        box-shadow: 0 10px 25px rgba(0,0,0,0.2); /* เพิ่มเงาให้ดูเด่นขึ้น */
    }

    /* Inner container ที่จะทำการ flip */
    .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.8s;
        transform-style: preserve-3d;
        /*border-radius: inherit;  รับค่าขอบมนมาจาก parent */
    }

    /* ทำให้การ์ดพลิกเมื่อคลิก */
    .flip-card.flipped .flip-card-inner {
        transform: rotateY(180deg);
    }

    /* สไตล์ของด้านหน้าและด้านหลัง */
    .flip-card-front, .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden; /* สำหรับ Safari */
        backface-visibility: hidden;
        overflow: hidden;
        /*border-radius: inherit;  รับค่าขอบมนมาจาก parent */
    }

    /* ด้านหลัง (เริ่มต้นจะถูกหมุนไป 180 องศา) */
    .flip-card-back {
        transform: rotateY(180deg);
    }

    /* สไตล์สำหรับรูปภาพให้เต็มพื้นที่การ์ด */
    img {
        width: 100%;
        height: 100%;
        /*object-fit: cover;*/
    }

    /* --- Media Query สำหรับมือถือ (หน้าจอกว้างไม่เกิน 768px) --- */
    @media (max-width: 768px) {
        /*h2 {
            display: none;  ซ่อนข้อความบนมือถือ 
        }*/
        

        .flip-card {
            /*width: 100vw;   กว้างเต็ม 100% ของ Viewport */
            /*height: 100vh;  สูงเต็ม 100% ของ Viewport */
            border-radius: 0; /* ไม่มีขอบมนเมื่อเต็มจอ */
            box-shadow: none; /* ไม่มีเงาเมื่อเต็มจอ */
        }
    }
</style>
</head>
<body>

<h2>คลิกที่การ์ดเพื่อพลิก</h2>

<div class="flip-card" id="myFlipCard">
  <div class="flip-card-inner">
    <div class="flip-card-front">
      <img src="img/wedding_card_f.jpg" alt="Front Image">
      <!-- <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070&auto=format&fit=crop" alt="Front Image"> -->
    </div>
    <div class="flip-card-back">
      <img src="img/wedding_card_b.jpg" alt="Back Image">
      <!-- <img src="https://images.unsplash.com/photo-1532274402911-5a369e4c4bb5?q=80&w=2070&auto=format&fit=crop" alt="Back Image"> -->
    </div>
  </div>
</div>

<script>
// ทำให้สามารถคลิกเพื่อพลิกการ์ดได้
document.getElementById('myFlipCard').addEventListener('click', function() {
  this.classList.toggle('flipped');
});
</script>

</body>

</html>
