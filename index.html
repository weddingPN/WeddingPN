<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding P&N</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
<style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background-color: #f0f0f0;
        font-family: sans-serif;
    }

    h2 {
        color: #333;
    }

    .flip-card {
        background-color: transparent;
        width: 360px; 
        height: 510px;  
        perspective: 1000px;
        cursor: pointer;

        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }


    .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.8s;
        transform-style: preserve-3d;

    }

 
    .flip-card.flipped .flip-card-inner {
        transform: rotateY(180deg);
    }


    .flip-card-front, .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden; 
        backface-visibility: hidden;
        overflow: hidden;

    }


    .flip-card-back {
        transform: rotateY(180deg);
    }


    img {
        width: 100%;
        height: 100%;

    }


    @media (max-width: 768px) {

        .flip-card {

            border-radius: 0; 
            box-shadow: none; 
        }
    }

    .prompt-thin {
    font-family: "Prompt", sans-serif;
    font-weight: 100;
    font-style: normal;
    }

    .prompt-extralight {
    font-family: "Prompt", sans-serif;
    font-weight: 200;
    font-style: normal;
    }

    .prompt-light {
    font-family: "Prompt", sans-serif;
    font-weight: 300;
    font-style: normal;
    }

    .prompt-regular {
    font-family: "Prompt", sans-serif;
    font-weight: 400;
    font-style: normal;
    }

    .prompt-medium {
    font-family: "Prompt", sans-serif;
    font-weight: 500;
    font-style: normal;
    }

    .prompt-semibold {
    font-family: "Prompt", sans-serif;
    font-weight: 600;
    font-style: normal;
    }

    .prompt-bold {
    font-family: "Prompt", sans-serif;
    font-weight: 700;
    font-style: normal;
    }

    .prompt-extrabold {
    font-family: "Prompt", sans-serif;
    font-weight: 800;
    font-style: normal;
    }

    .prompt-black {
    font-family: "Prompt", sans-serif;
    font-weight: 900;
    font-style: normal;
    }

    .prompt-thin-italic {
    font-family: "Prompt", sans-serif;
    font-weight: 100;
    font-style: italic;
    }

    .prompt-extralight-italic {
    font-family: "Prompt", sans-serif;
    font-weight: 200;
    font-style: italic;
    }

    .prompt-light-italic {
    font-family: "Prompt", sans-serif;
    font-weight: 300;
    font-style: italic;
    }

    .prompt-regular-italic {
    font-family: "Prompt", sans-serif;
    font-weight: 400;
    font-style: italic;
    }

    .prompt-medium-italic {
    font-family: "Prompt", sans-serif;
    font-weight: 500;
    font-style: italic;
    }

    .prompt-semibold-italic {
    font-family: "Prompt", sans-serif;
    font-weight: 600;
    font-style: italic;
    }

    .prompt-bold-italic {
    font-family: "Prompt", sans-serif;
    font-weight: 700;
    font-style: italic;
    }

    .prompt-extrabold-italic {
    font-family: "Prompt", sans-serif;
    font-weight: 800;
    font-style: italic;
    }

    .prompt-black-italic {
    font-family: "Prompt", sans-serif;
    font-weight: 900;
    font-style: italic;
    }
    a{
        text-decoration: none;
        color:#333;
    }
</style>
</head>
<body>

<h2 class="prompt-regular">คลิกที่การ์ดเพื่อพลิก</h2>

<div class="flip-card" id="myFlipCard">
  <div class="flip-card-inner">
    <div class="flip-card-front">
      <img src="img/wedding_card_f.png" alt="Front Image">

    </div>
    <div class="flip-card-back">
      <img src="img/wedding_card_b.png" alt="Back Image">

    </div>
  </div>
</div>
<h2 class="prompt-regular"><a href="//maps.app.goo.gl/XTmbuFf6Ncp7Zgdc7"><font color="red"><i class="bx bx-map"></i></font>คลิกที่นี่เพื่อดูสถานที่</a></h2>
<script>

document.getElementById('myFlipCard').addEventListener('click', function() {
  this.classList.toggle('flipped');
});
</script>

</body>
</html>
